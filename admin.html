<style>
  :root{--morado:#2a1259;--morado2:#4b1fa3;--rosa:#e6258a;--fondo:#f4f2f8;--txt:#1d1530;--gris:#6b6480;--borde:#e2dcef;
        --ok:#13895b;--okbg:#e5f5ed;--warn:#9a6b00;--warnbg:#fff4d6;--err:#c62828;--errbg:#fdecea}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--txt);font-size:15px}
  button{font-family:inherit}
  a{color:var(--morado2)}
  .oculto{display:none!important}
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--morado),var(--morado2))}
  #login .box{background:#fff;border-radius:18px;padding:34px 30px;width:320px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  #login h1{margin:0 0 4px;font-size:22px}#login p{color:var(--gris);margin:0 0 20px;font-size:14px}
  #login input{width:100%;font-size:26px;text-align:center;letter-spacing:.4em;padding:12px;border:2px solid var(--borde);border-radius:12px}
  .top{background:var(--morado);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 18px;flex-wrap:wrap}
  .top .marca{font-weight:800;font-size:18px;margin-right:auto}.top .marca small{color:#ffb3db;font-weight:600;font-size:12px;letter-spacing:.12em;margin-left:8px}
  .top button,.top a{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none}
  .top button:hover,.top a:hover{background:rgba(255,255,255,.22)}
  nav{display:flex;gap:4px;background:#fff;padding:0 18px;border-bottom:1px solid var(--borde);overflow-x:auto}
  nav button{border:0;background:none;padding:14px 14px;font-size:15px;font-weight:700;color:var(--gris);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.on{color:var(--morado2);border-color:var(--rosa)}
  .badge{display:inline-block;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--rosa);color:#fff;font-size:12px;margin-left:4px}
  main{padding:18px;max-width:1360px;margin:0 auto}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .filtros select,.filtros input{padding:9px 10px;border:1.5px solid var(--borde);border-radius:9px;font-size:14px;background:#fff}
  .filtros input[type=search]{min-width:240px}
  .esp{flex:1}
  .btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:14px;background:var(--rosa);color:#fff;text-decoration:none;display:inline-block}
  .btn.sec{background:#ece6f8;color:var(--morado)}.btn.ok{background:var(--ok)}.btn.err{background:var(--err)}
  .btn.mini{padding:5px 9px;font-size:13px}
  .btn.wa{background:#1fa855;color:#fff}.btn.wa.enviado{background:#d9f2e3;color:#13703a}.btn.wa.enviado:after{content:' ✓'}
  .btn:disabled{opacity:.5;cursor:wait}
  .tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .t{background:#fff;border-radius:14px;padding:16px;border:1px solid var(--borde)}
  .t .n{font-size:27px;font-weight:800;margin-top:4px}.t .l{color:var(--gris);font-size:13px;font-weight:600}
  .t.ok .n{color:var(--ok)}.t.warn .n{color:var(--warn)}.t.err .n{color:var(--err)}.t.clic{cursor:pointer}.t.clic:hover{border-color:var(--rosa)}
  .panel{background:#fff;border-radius:14px;border:1px solid var(--borde);overflow:auto}
  .caja{background:#fff;border-radius:14px;border:1px solid var(--borde);padding:18px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--gris);padding:10px 12px;background:#faf8fd;border-bottom:1px solid var(--borde);white-space:nowrap}
  td{padding:9px 12px;border-bottom:1px solid #f0ecf6;vertical-align:middle}
  tr.clic{cursor:pointer}tr.clic:hover td{background:#faf7ff}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .acc{white-space:nowrap;text-align:right}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
  .chip.pagado,.chip.Aprobado,.chip.Activa,.chip.si{background:var(--okbg);color:var(--ok)}
  .chip.verificar,.chip.revisar{background:var(--warnbg);color:var(--warn)}
  .chip.debe,.chip.Rechazado,.chip.no{background:var(--errbg);color:var(--err)}
  .chip.Inactiva,.chip.gris{background:#eee;color:#666}
  .sub{color:var(--gris);font-size:13px}
  .barra{height:8px;background:#f0ecf6;border-radius:4px;overflow:hidden;min-width:80px}.barra i{display:block;height:100%;background:var(--ok)}
  .vacio{padding:40px;text-align:center;color:var(--gris)}
  h3{margin:22px 0 10px;font-size:16px}
  #fondo{position:fixed;inset:0;background:rgba(20,10,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:10}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:820px;padding:22px}
  .modal h2{margin:0 0 14px;font-size:19px}
  .modal h4{margin:18px 0 8px;font-size:14px;color:var(--morado2);border-top:1px solid var(--borde);padding-top:14px}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px}
  .form label{display:block;font-size:13px;font-weight:600;color:var(--gris);margin-bottom:4px}
  .form input,.form select,.form textarea{width:100%;padding:9px 10px;border:1.5px solid var(--borde);border-radius:9px;font-size:15px;font-family:inherit}
  .full{grid-column:1/-1}
  .pie-modal{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .meses{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
  .meses label{display:block;margin:0;cursor:pointer}
  .meses input{display:none}
  .meses span{display:block;text-align:center;padding:7px 2px;border:1.5px solid var(--borde);border-radius:8px;font-size:13px;font-weight:600;color:var(--txt)}
  .meses input:checked+span{background:var(--morado2);color:#fff;border-color:var(--morado2)}
  .meses .pagado span{background:var(--okbg);color:var(--ok);border-color:#bfe6d3}
  .meses .verificar span{background:var(--warnbg);color:var(--warn)}
  .comp img{max-width:100%;border-radius:10px;border:1px solid var(--borde)}
  .comp embed{width:100%;height:65vh;border:1px solid var(--borde);border-radius:10px}
  .info{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-bottom:14px}.info b{color:var(--gris);font-weight:600}
  .archs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .arch{border:1px solid var(--borde);border-radius:10px;padding:10px;font-size:13px}
  .arch b{display:block;margin-bottom:6px}
  .arch input{font-size:12px;width:100%}
  .foto{width:84px;height:84px;border-radius:12px;object-fit:cover;background:#eee;flex:none}
  textarea.copiar,textarea.pegar{width:100%;min-height:200px;font-family:inherit;font-size:14px;padding:12px;border:1.5px solid var(--borde);border-radius:10px}
  .pasos{counter-reset:p;margin:0;padding:0;list-style:none}
  .pasos li{counter-increment:p;position:relative;padding-left:34px;margin:8px 0;font-size:14px}
  .pasos li:before{content:counter(p);position:absolute;left:0;top:-2px;width:24px;height:24px;border-radius:50%;background:var(--morado2);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  td select{padding:6px;border:1.5px solid var(--borde);border-radius:8px;max-width:260px;font-size:13px}
  #cargando{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rosa),var(--morado2),var(--rosa));background-size:200% 100%;animation:c 1s linear infinite;z-index:20}
  @keyframes c{to{background-position:-200% 0}}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
  #toast.err{background:var(--err)}

  .logo{background:var(--logo) center/contain no-repeat;mix-blend-mode:screen;aspect-ratio:520/443}
  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 42%,#33105a 0%,#0b0314 68%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .55s ease}
  #splash .logo{width:min(72vw,380px);animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
  #splash .carga{margin-top:22px;width:130px;height:3px;border-radius:2px;background:linear-gradient(90deg,#e6258a,#7b2ff7,#e6258a);background-size:200% 100%;animation:fluye 1s linear infinite}
  #splash .lema{margin-top:14px;color:#cdb8ef;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
  #splash.fuera{opacity:0;pointer-events:none}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fluye{to{background-position:-200% 0}}
  #login{background:radial-gradient(circle at 50% 30%,#3a1266 0%,#0b0314 70%)!important;flex-direction:column;gap:6px}
  #login .logo{width:min(70vw,300px)}
  .top{background:linear-gradient(90deg,#12051f,#2a1259)!important}
  .top .logo{width:58px;flex:none;margin:-6px 0}
  .foto-coach{border-radius:50%;background:#ece6f8 center/cover no-repeat;color:var(--morado2);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
  #aviso{max-width:1360px;margin:0 auto;padding:0 18px}
  .cumple-hoy{display:flex;gap:14px;align-items:center;background:#fff0f8;border:1px solid #f3a6cf;border-radius:14px;padding:12px 16px;margin-top:14px;line-height:1.9}
  .cumple-hoy .pastel{font-size:34px}
  .qrs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .qrcard{border:1px solid var(--borde);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .qrcard img{width:190px;height:190px;image-rendering:pixelated}
  .qrcard b{font-size:17px;color:var(--rosa)}
  .qrcard input{width:100%;font-size:12px;padding:7px;border:1.5px solid var(--borde);border-radius:8px;color:var(--gris)}
  #afiche{display:none}
  @media print{
    @page{size:letter;margin:12mm}
    html,body{background:#fff!important}
    body>*{display:none!important}
    #afiche{display:block!important;font-family:system-ui,Segoe UI,Roboto,sans-serif;text-align:center;color:#1d1530;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #afiche .af-top{background:radial-gradient(circle at 50% 40%,#3a1266,#0b0314 75%);border-radius:18px;padding:10px 0}
    #afiche .af-top .logo{width:300px;margin:0 auto}
    #afiche h1{font-size:34px;margin:18px 0 4px}
    #afiche .af-lead{font-size:18px;color:#6b6480;margin:0 0 18px}
    #afiche .af-qrs{display:flex;gap:24px;justify-content:center}
    #afiche .af-qrs div{flex:1;border:2px solid #e2dcef;border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
    #afiche .af-qrs img{width:230px;height:230px}
    #afiche .af-qrs b{font-size:21px;color:#e6258a}
    #afiche .af-qrs span{font-size:14px;color:#6b6480}
    #afiche .af-pago{font-size:20px;font-weight:700;margin:20px 0 4px}
    #afiche .af-pie{font-size:13px;color:#6b6480}
  }
</style>
</head>

  activas().concat(D.entrenadores.filter(e => e.estado === 'Activo').map(e => { e.esCoach = true; e.equipo = 'Coach'; return e; })).forEach(d => {
    const m = String(d.fechaNacimiento || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return;
    const ny = +m[1], nm = +m[2], nd = +m[3];
    const fecha = y => Date.UTC(y, nm - 1, (nm === 2 && nd === 29 && !bis(y)) ? 28 : nd);
    let y = h[0], f = fecha(y); if (f < base) { y++; f = fecha(y); }
    const falta = Math.round((f - base) / 86400000);
    if (falta <= dias) out.push({ d: d, dias: falta, edad: y - ny, fecha: new Date(f + 43200000) });
  });
  return out.sort((a, b) => a.dias - b.dias || a.d.nombre.localeCompare(b.d.nombre));
}

function parsearTabla(txt) {

    else campo += ch;

const AS_CACHE = {};
function verAsistencia() {

    '<p class="sub">Los papás escanean con la cámara del celular. No necesitan cuenta de Google ni espacio en su Drive.</p>' +
    '<h3 style="margin-top:6px">Para los coaches</h3><div class="qrs" style="grid-template-columns:1fr">' + tarjeta('Coaches', 'Registro y cuentas de cobro (no se incluye en el afiche de papás)', U.coaches, 'uCoach') + '</div>' +
    '<div class="pie-modal" style="justify-content:space-between"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="imprimirAfiche()">🖨️ Imprimir afiche</button><button class="btn wa" onclick="imagenAfiche()">🖼️ Imagen para WhatsApp</button></div><button class="btn sec" onclick="cerrar()">Listo</button></div>' +
    '<div id="afiImg"></div>' +
    '<details style="margin-top:14px"><summary class="sub" style="cursor:pointer">Enlace de recepción (solo para el club, nunca compartir)</summary><input readonly value="' + esc(U.admin) + '" onclick="this.select()" style="width:100%;margin-top:6px;padding:8px;border:1.5px solid var(--borde);border-radius:8px"></details>');
}
function imprimirAfiche() {
  const U = urlsPadres();
  let af = $('afiche'); if (!af) { af = document.createElement('div'); af.id = 'afiche'; document.body.appendChild(af); }
  af.innerHTML = '<div class="af-top"><div class="logo"></div></div>' +
    '<h1>Pagos e inscripciones</h1><p class="af-lead">Escanea el código con la cámara de tu celular</p>' +
    '<div class="af-qrs"><div><img src="' + qrSrc(U.pago) + '"><b>Subir comprobante de pago</b><span>Mensualidades, matrícula, trimestre y plan familiar</span></div>' +
    '<div><img src="' + qrSrc(U.ins) + '"><b>Inscripción de deportistas</b><span>Datos, documento, EPS y foto</span></div></div>' +
    (D.config.datosPago ? '<p class="af-pago">' + esc(D.config.datosPago) + '</p>' : '') +
    '<p class="af-pie">No necesitas cuenta de Google · ' + esc(D.config.club) + '</p>';
  setTimeout(() => { try { window.print(); } catch (e) { toast('Tu navegador no permitió imprimir desde aquí; usa «Imagen para WhatsApp» e imprímela.', true); } }, 300);
}
function cargarImg(src) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
function imagenAfiche() {
  const U = urlsPadres(), W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  Promise.all([cargarImg(logoSrc()), cargarImg(qrSrc(U.pago)), cargarImg(qrSrc(U.ins))]).then(([logo, q1, q2]) => {
    const g = x.createRadialGradient(W / 2, 330, 40, W / 2, 420, 900); g.addColorStop(0, '#3a1266'); g.addColorStop(1, '#0b0314');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'screen'; const lw = 470, lh = lw * logo.height / logo.width; x.drawImage(logo, (W - lw) / 2, 30, lw, lh); x.globalCompositeOperation = 'source-over';
    x.textAlign = 'center'; x.fillStyle = '#ffffff'; x.font = '800 54px system-ui, Segoe UI, Roboto, sans-serif'; x.fillText('Pagos e inscripciones', W / 2, 500);
    x.fillStyle = '#cdb8ef'; x.font = '500 30px system-ui, Segoe UI, Roboto, sans-serif'; x.fillText('Escanea el código con la cámara de tu celular', W / 2, 550);
    const card = (q, cx, t1, t2) => {
      const cw = 440, ch = 560, y = 600; x.fillStyle = '#ffffff'; redondo(x, cx - cw / 2, y, cw, ch, 34); x.fill();
      x.drawImage(q, cx - 180, y + 30, 360, 360);
      x.fillStyle = '#e6258a'; x.font = '800 36px system-ui, Segoe UI, Roboto, sans-serif'; x.fillText(t1, cx, y + 448);
      x.fillStyle = '#4b3a66'; x.font = '500 25px system-ui, Segoe UI, Roboto, sans-serif'; t2.forEach((l, i) => x.fillText(l, cx, y + 492 + i * 32));
    };
    card(q1, 290, 'Subir pago', ['Comprobantes de', 'mensualidad y matrícula']);
    card(q2, 790, 'Inscripción', ['Nuevas deportistas:', 'datos, documento y EPS']);
    x.fillStyle = '#ffffff'; x.font = '700 32px system-ui, Segoe UI, Roboto, sans-serif'; x.fillText(D.config.datosPago || '', W / 2, 1230);
    x.fillStyle = '#9d86c4'; x.font = '500 24px system-ui, Segoe UI, Roboto, sans-serif'; x.fillText('No necesitas cuenta de Google · ' + D.config.club, W / 2, 1290);
    const url = c.toDataURL('image/png');
    $('afiImg').innerHTML = '<div style="margin-top:14px;text-align:center"><img src="' + url + '" alt="Afiche con códigos QR" style="max-width:340px;width:100%;border-radius:12px;border:1px solid var(--borde)">' +
      '<div style="margin-top:8px"><a class="btn" download="Energy All Stars - QR pagos e inscripciones.png" href="' + url + '">⬇️ Descargar imagen</a></div>' +
      '<p class="sub">Si no se descarga, haz clic derecho sobre la imagen → «Guardar imagen como…». Luego envíala por WhatsApp a los grupos.</p></div>';
  }).catch(e => fallo(new Error('No se pudo crear la imagen: ' + (e && e.message || e))));
}
function redondo(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }

/* ======================= modal ======================= */
function abrir(html) { $('modal').innerHTML = html; $('fondo').classList.remove('oculto'); $('fondo').scrollTop = 0; }
function cerrar() { $('fondo').classList.add('oculto'); $('modal').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('fondo').classList.contains('oculto')) cerrar(); });
</script>
<script>if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }</script>
